<!DOCTYPE html>
<html>

<head>
    <title>CHAT BOT</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #24104f 0%, transparent 35%),
                radial-gradient(circle at bottom right, #063b4a 0%, transparent 35%),
                #090912;
            color: white;
            min-height: 100vh;
        }

        .js-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* Main chatbot box */
        .chat-app {
            width: 700px;
            height: 85vh;
            max-height: 750px;

            display: flex;
            flex-direction: column;

            background: rgba(18, 18, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 0 30px rgba(139, 92, 246, 0.25),
                0 0 70px rgba(6, 182, 212, 0.12);
        }

        /* Chat messages area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;

            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 7px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #6d28d9;
            border-radius: 10px;
        }

        /* Individual message */
        .chat-message {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 75%;
        }

        .chat-message img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* Robot message */
        .robot-message {
            align-self: flex-start;
        }

        .robot-message .message-text {
            background: linear-gradient(135deg, #1f1f35, #252544);
            border: 1px solid rgba(139, 92, 246, 0.35);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.12);
            border-radius: 18px 18px 18px 4px;
        }

        /* User message */
        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .user-message .message-text {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            border-radius: 18px 18px 4px 18px;
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.25);
        }

        /* Message text */
        .message-text {
            padding: 12px 16px;
            line-height: 1.5;
            word-break: break-word;
        }

        /* Input area */
        .chat-input-area {
            padding: 18px;
            display: flex;
            gap: 12px;

            background: rgba(10, 10, 20, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Input */
        .chat-input {
            flex: 1;
            padding: 14px 18px;

            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 14px;

            background: #131320;
            color: white;

            outline: none;
            font-size: 15px;

            transition: 0.2s;
        }

        .chat-input::placeholder {
            color: #77758c;
        }

        .chat-input:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139, 92, 246, 0.12),
                0 0 18px rgba(139, 92, 246, 0.2);
        }

        /* Send button */
        .send-button {
            border: none;
            padding: 0 22px;

            border-radius: 14px;

            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .send-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 20px rgba(124, 58, 237, 0.35);
        }

        .send-button:active {
            transform: translateY(0);
        }

        /* Loading message */
        .loading-message {
            opacity: 0.75;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.45;
            }

            50% {
                opacity: 1;
            }
        }

        /* Mobile */
        @media (max-width: 750px) {
            .js-container {
                padding: 10px;
            }

            .chat-app {
                width: 100%;
                height: 95vh;
            }

            .chat-message {
                max-width: 90%;
            }

            .chat-input-area {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <!--
      we are going to study about components in react. its basically a part of the websites components so that we can work on it in at a time or
      A component is a JavaScript function that returns the UI we want to display.
    -->
    <!--
     Props = Properties

        Props are a way to pass data from a parent component to a child component.
        and props make our component reusable
    -->


    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>

    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script type="text/babel">

        function ChatInput({
            chatMessages, setChatMessages, isLoading, setIsLoading
        }) {

            const[inputText, setInputText] = React.useState("")


            //event = Information about what happened
            function saveInputText(event) {
             setInputText(event.target.value);
            }

            async function sendMessage(){
              console.log(inputText)

              const newChatMessages = [
                    ...chatMessages,//this is used to copy the previous code and then move forward
                    {
                        message: inputText,
                        sender: 'user',
                        id: crypto.randomUUID()//for randomly generatiog the id everytime
                    }
                ]

              setChatMessages(newChatMessages);
              setInputText('');//to make the text empty in input so we dont wnt to refressh again and again
              setIsLoading(true); 

                //this is used to get the response from the Bot
                const response = await Chatbot.getResponseAsync(inputText);
                setChatMessages([
                    ...newChatMessages,//this is used to copy the previous code and then move forward
                    {
                        message: response,
                        sender: 'robot',
                        id: crypto.randomUUID()//for randomly generatiog the id everytime
                    }
                ]);
                setIsLoading(false);
    
            }

            return (
                <div className="chat-input-area"> {/* <></> these are called fragments it is used for removing the extra div from our code */}
                {/*onChange = runs a function when we change the text inside an input */}
                    <input
                        className="chat-input"
                        placeholder="Heyyy! Buddy how can i help you"
                        size="50"
                        onChange={saveInputText}
                        value={inputText}//it is used change the text inside input so we dont wnt to refressh again and again 
                        
                        // onKeyDown runs a function whenever a keyboard key is pressed.
                       onKeyDown={(event) => {
                           if (event.key === 'Enter') {
                             sendMessage();
                           }

                            if (event.key === 'Escape') {
                                setInputText('');
                            }
                        }}
                    />
                    <button
                        className="send-button"
                        onClick={sendMessage}
                    >Send</button>
                    {isLoading && <div>Loading...</div>}

                </div>
            );
        }

        function ChatMessage({ message, sender, className = ''  }) {
            //console.log(props); o/p hello budyyy

            //  const message = props.message;
            //  const sender = props.sender;

            // we can write it is as 
            // const {message, sender} = props;// this is called destructuring it is same as these const sender = props.sender; 

            /*
            if(sender === 'robot'){
             return(
                 <div>
                     <img src="robot.png" width="50" />
                     {message}                
                 </div> 
             );
            }
             // instead of using if statemnts we can directly it in our jsx by using the guard operator (&&) like
            */

            return (
                <div  className={`chat-message ${sender}-message ${className}`}>
                    {sender === 'robot' && (
                        <img src="images/robot.png" width="50" />
                    )}

                    <div className="message-text">
                        {message}
                    </div>

                    {sender === 'user' && (
                        <img src="images/user.png" width="50" />
                    )}

                </div>
            )
        }

        //const app = (
        <>
            {/*
        {/* we can also write it as
                {ChatInput()} orrr

                <ChatInput></ChatInput> 
                <ChatInput />
            
            but mainly we write in react like this

                message="Hello buddyyy"

            />
            */}



        </>

        //);



        function ChatMessages({chatMessages, isLoading}) {


           //how we actually send message by pressing the send button here is the main logic that we use in above in send button
           // function sendMessage() {
                /*
                    Create a new array:

                    1. Copy all previous messages using ...
                    2. Add a new message at the end
               */
              
               /*
                    setChatMessages([
                        ...chatMessages,//this is used to copy the previous code and then move forward
                        {
                            message: 'test',
                            sender: 'user',
                            id: crypto.randomUUID()//for randomly generatiog the id everytime
                        }
                    ]);
               */ 
            //}

            //useRef = automatically save an html element from the component or useRef is basically a container with special react features
            const chatMessagesRef = React.useRef(null)

            //useEffect = run some code after the component is created or updated it have two parameters the first one is what to do and the second one is when to do(dependency array) 
            React.useEffect(() => {
                const containerElem = chatMessagesRef.current;
                if(containerElem){
                    containerElem.scrollTop = containerElem.scrollHeight;
                }
            },[chatMessages])

            return (
                <div 
                    className="chat-messages"
                    ref={chatMessagesRef}>
                    {/*
                        Go through every object in chatMessages
                        and create one ChatMessage component for each.
                    */}

                    {chatMessages.map((chatMessages) => {
                        return (
                            <ChatMessage
                                message={chatMessages.message}
                                sender={chatMessages.sender}
                                key={chatMessages.id}
                            />
                        );
                    })}{/*we generating the message(html) through js*/}
                    {isLoading && (
                        <ChatMessage
                            message="Loading..."
                            sender="robot"
                            className="loading-message"
                        />
                    )}
                </div>
            )
        }

        function App() {
            // Creating a storage place for our message(data) array of objects and then generate the html for further use
            // useState = is basically a data that belongs to a component and can change over time
            /*
                useState gives us two values:

                [0] → The current state (our chat messages)
                [1] → A function used to update the state
           */

            const [chatMessages, setChatMessages] = React.useState(
                [{
                    message: "Hello buddyyy",
                    sender: "user",
                    id: 'id1'
                }, {
                    message: "Heyy! buddy how can i help you",
                    sender: "robot",
                    id: 'id2'
                }, {
                    message: "can you tell me todays date",
                    sender: "user",
                    id: 'id3'
                }, {
                    message: "Today is August 11",
                    sender: "robot",
                    id: 'id4'
                }]
            )
            /*
             const[chatMessages, setChatMessages] = array;

             array[0] contains the current chat messages and continue from first element
             const chatMessages = array[0];

             array[1] contains the function used to update the chat messages
             const setChatMessages = array[1];
            */
            const [isLoading, setIsLoading] = React.useState(false);


            return (
                <div className="chat-app">
                    <ChatMessages 
                        chatMessages={chatMessages}
                        isLoading = {isLoading}
                    />
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                        isLoading={isLoading}
                        setIsLoading={setIsLoading}
                    />
                    

                </div>
            );
        }

        const container = document.querySelector('.js-container');

        ReactDOM.createRoot(container).render(<App />);

    </script>

</body>

</html>
